<!-- 1. TWITCH PLAYER EMBED -->
<div class="player-container">
    <h3>1. Keep Twitch Active & Unmuted</h3>
    <div id="twitch-player"></div>
</div>

<!-- 2. PRIVATE HLS MOVIE PLAYER -->
<div class="player-container" id="private-wrapper">
    <h3>2. Your Private Screen Share</h3>
    <div id="lock-overlay">⚠️ ACCESS LOCKED!<br>You must unpause and unmute the Twitch stream above to watch!</div>
    <video id="private-video" controls playsinline></video>
</div>

<script>
    // REPLACE 'YOUR_TWITCH_USERNAME' WITH YOUR ACTUAL TWITCH CHANNEL NAME
    const TWITCH_CHANNEL = 'YOUR_TWITCH_USERNAME';

    // FOR LOCAL TESTING: This points to your local MediaMTX HLS feed
    const HLS_STREAM_URL = 'http://localhost:8554/live/movie/index.m3u8';

    // Initialize Twitch Player
    const twitchOptions = { width: '100%', height: 250, channel: TWITCH_CHANNEL, parent: [window.location.hostname] };
    const twitchPlayer = new Twitch.Player("twitch-player", twitchOptions);

    // Initialize Private Video Player via HLS.js
    const video = document.getElementById('private-video');
    const overlay = document.getElementById('lock-overlay');

    if (HLS.isSupported()) {
        const hls = new Hls();
        hls.loadSource(HLS_STREAM_URL);
        hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native support for Apple Safari Mobile
        video.src = HLS_STREAM_URL;
    }

    // Anti-Lurk Enforcement Loop (Checks player state every 1 second)
    setInterval(() => {
        const isPaused = twitchPlayer.isPaused();
        const isMuted = twitchPlayer.getMuted();
        const volume = twitchPlayer.getVolume();

        // Rule: Lock if Twitch is paused, muted, or volume slider is at 0
        if (isPaused || isMuted || volume === 0) {
            overlay.style.display = 'flex';
            video.pause();
        } else {
            overlay.style.display = 'none';
        }
    }, 1000);
</script>
