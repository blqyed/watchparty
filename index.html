<style>
    body {
        margin: 0;
        background: #0e0e10;
        color: white;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 10px;
        box-sizing: border-box;
        position: relative;
    }

    /* MAIN THEATER CONTAINER */
    .theater-stage {
        width: 100%;
        max-width: 960px;
        position: relative;
        margin-bottom: 15px;
        background: black;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    /* PRIVATE STREAM */
    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: black;
    }

    /* VISUAL FULLSCREEN */
    #private-feed.visual-fullscreen {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        max-width: none !important;
        max-height: none !important;
        margin: 0 !important;
        border-radius: 0 !important;
        object-fit: contain !important;
        background: black !important;
        z-index: 10000 !important;
    }

    body.private-visual-fullscreen {
        overflow: hidden;
    }

    /* CUSTOM FULLSCREEN BUTTON */
    #custom-fullscreen-btn {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 10001;
        border: 0;
        border-radius: 6px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.75);
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        transition: background 0.15s ease;
    }

    #custom-fullscreen-btn:hover {
        background: rgba(40, 40, 40, 0.9);
    }

    #custom-fullscreen-btn.visual-fullscreen-button {
        position: fixed;
        right: 18px;
        bottom: 18px;
    }

    /* TWITCH EMBED */
    .twitch-mini-box {
        position: fixed;

        /* Flush with the top edge */
        top: 0;

        right: 25px;

        width: 400px !important;
        height: 300px !important;

        min-width: 400px;
        min-height: 300px;

        /*
         * Twitch remains above the private video during
         * the visibility-threshold experiment.
         */
        z-index: 99999;

        background: #000;
        border: 2px solid #a970ff;
        border-radius: 4px;
        overflow: hidden;

        box-shadow:
            0 4px 15px rgba(0, 0, 0, 0.75);

        pointer-events: none;

        transition: right 0.15s ease;
    }

    #twitch-frame {
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    /*
     * 45% VISIBILITY TEST
     *
     * Twitch box is approximately 400px wide.
     *
     * 45% of 400px = 180px.
     *
     * Moving it approximately 220px to the right
     * leaves approximately 180px visible.
     *
     * 180 / 400 = 45%
     */
    body.private-visual-fullscreen
    .twitch-mini-box {
        right: -220px;
    }

    /* LOCK GATE */
    #gate {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;

        background: rgba(0, 0, 0, 0.95);

        display: flex;
        justify-content: center;
        align-items: center;

        text-align: center;
        font-weight: bold;
        color: #ff4f4f;

        padding: 20px;
        box-sizing: border-box;

        z-index: 40;
        display: none;
    }

    /* AUDIO DASHBOARD */
    .audio-dashboard {
        display: flex;

        background: #1f1f23;
        border-radius: 6px;
        padding: 4px;

        width: 100%;
        max-width: 960px;

        box-sizing: border-box;
    }

    .audio-tab {
        flex: 1;

        background: #26262c;
        border: 1px solid #3a3a44;

        color: #adadb8;

        padding: 14px;

        font-weight: bold;
        cursor: pointer;

        border-radius: 4px;

        transition: all 0.2s ease;

        font-size: 14px;
        text-align: center;
    }

    .audio-tab:hover {
        background: #33333b;
        color: white;
        border-color: #a970ff;
    }

    .audio-tab.activated {
        background: #a970ff;
        color: white;
        border-color: #a970ff;
        cursor: default;
    }

    @media (max-width: 700px) {
        .twitch-mini-box {
            display: none;
        }
    }

<!-- TWITCH VERIFICATION PLAYER -->
<div

<!-- PRIVATE STREAM -->
<div

    <!-- PRIVATE VIDEO -->
    <video
        id="private-feed"
        playsinline
        controls
        controlsList="nofullscreen"
    ></video>

    <!-- CUSTOM FULLSCREEN -->
    <button
        id="custom-fullscreen-btn"
        type="button"
        aria-label="Toggle fullscreen"
    >
        ⛶ Fullscreen
    </button>

</div>

<!-- AUDIO / UNLOCK BUTTON -->
<div class="audio-dashboard">
    <button
        id="btn-audio-unlock"
        class="audio-tab"
        onclick="unlockAlternativeStream()"
    >
        📺 Click to Watch Alternative Livestream
    </button>
</div>

<script>

    // =========================================================
    // CONFIGURATION
    // =========================================================

    const CHANNEL_NAME = 'fraudvlent';

    const STREAM_SOURCE =
        'https://rain-fields-primarily-settlement.trycloudflare.com/live/watchparty/whep';


    // =========================================================
    // TWITCH PLAYER
    // =========================================================

    const twOptions = {
        width: '400',
        height: '300',
        channel: CHANNEL_NAME,
        muted: true,
        parent: [
            "blqyed.github.io",
            window.location.hostname
        ]
    };

    const twPlayer =
        new Twitch.Player(
            "twitch-frame",
            twOptions
        );


    // =========================================================
    // DOM ELEMENTS
    // =========================================================

    const vid =
        document.getElementById('private-feed');

    const gate =
        document.getElementById('gate');

    const audioBtn =
        document.getElementById('btn-audio-unlock');

    const twitchBox =
        document.getElementById('twitch-mini-box');

    const fullscreenBtn =
        document.getElementById('custom-fullscreen-btn');


    // =========================================================
    // STATE
    // =========================================================

    vid.muted = true;

    let systemUnlocked = false;

    let keepTwitchAliveInterval = null;

    let visualFullscreen = false;


    // =========================================================
    // MEDIAMTX WEBRTC
    // =========================================================

    let webrtcReader =
        new MediaMTXWebRTCReader({

            url: STREAM_SOURCE,

            onError: (err) => {
                console.error(err);
            },

            onTrack: (evt) => {
                vid.srcObject =
                    evt.streams[0];
            },

        });


    // =========================================================
    // UNLOCK ALTERNATIVE STREAM
    // =========================================================

    function unlockAlternativeStream() {

        systemUnlocked = true;

        audioBtn.innerHTML =
            "✨ Viewing Alternative Livestream";

        audioBtn.classList.add('activated');

        audioBtn.onclick = null;

        vid.muted = false;

        vid.controls = true;


        if (twPlayer) {

            twPlayer.setMuted(false);

            twPlayer.setVolume(0.01);

            twPlayer.play();

        }


        vid.play().catch(err => {

            console.log(
                "User interaction play bypass applied:",
                err
            );

        });

    }


    // =========================================================
    // TWITCH KEEP ALIVE
    // =========================================================

    function keepTwitchAlive() {

        if (!twPlayer) {
            return;
        }

        /*
         * During visual fullscreen we deliberately allow
         * Twitch to manage its own playback state.
         */
        if (visualFullscreen) {
            return;
        }

        if (twPlayer.isPaused()) {

            console.log(
                "Twitch was paused, forcing play..."
            );

            twPlayer.play();

            if (twPlayer.getMuted()) {

                twPlayer.setMuted(false);

                twPlayer.setVolume(0.01);

            }

        }

    }


    // =========================================================
    // TWITCH VERIFICATION CONTROL
    // =========================================================

    twPlayer.addEventListener(
        Twitch.Player.READY,
        () => {

            twPlayer.play();


            keepTwitchAliveInterval =
                setInterval(
                    keepTwitchAlive,
                    500
                );


            twPlayer.addEventListener(
                Twitch.Player.PLAY,
                () => {

                    console.log(
                        "Twitch Status: PLAYING"
                    );

                }
            );


            twPlayer.addEventListener(
                Twitch.Player.PAUSE,
                () => {

                    console.log(
                        "Twitch Status: PAUSED"
                    );

                    /*
                     * During visual fullscreen,
                     * let Twitch decide naturally.
                     */
                    if (!visualFullscreen) {

                        setTimeout(() => {

                            twPlayer.play();

                        }, 100);

                    }

                }
            );


            setInterval(() => {

                const twitchPaused =
                    twPlayer.isPaused();


                /*
                 * Normal mode:
                 * keep Twitch alive.
                 *
                 * Visual fullscreen:
                 * do not force Twitch.
                 */
                if (
                    twitchPaused &&
                    !visualFullscreen
                ) {

                    console.log(
                        "Verification loop detected pause - forcing play"
                    );

                    twPlayer.play();

                    if (twPlayer.getMuted()) {

                        twPlayer.setMuted(false);

                        twPlayer.setVolume(0.01);

                    }

                }


                /*
                 * Keep private stream playing.
                 */
                if (systemUnlocked) {

                    gate.style.display =
                        'none';


                    if (vid.paused) {

                        vid.play().catch(
                            err => console.log(
                                "Background playback loop stabilization:",
                                err
                            )
                        );

                    }

                    vid.muted = false;

                } else {

                    if (
                        twitchPaused &&
                        !systemUnlocked
                    ) {

                        gate.style.display =
                            'flex';

                        vid.pause();

                    } else {

                        gate.style.display =
                            'none';

                        vid.muted = true;

                    }

                }

            }, 250);

        }
    );


    // =========================================================
    // VISUAL FULLSCREEN
    // =========================================================

    function enterVisualFullscreen() {

        if (visualFullscreen) {
            return;
        }

        visualFullscreen = true;

        vid.classList.add(
            'visual-fullscreen'
        );

        document.body.classList.add(
            'private-visual-fullscreen'
        );

        fullscreenBtn.classList.add(
            'visual-fullscreen-button'
        );

        fullscreenBtn.innerHTML =
            '⛶ Exit Fullscreen';


        console.log(
            'Entered VISUAL fullscreen'
        );

        console.log(
            'Twitch visibility test: approximately 45%'
        );

    }


    function exitVisualFullscreen() {

        if (!visualFullscreen) {
            return;
        }

        visualFullscreen = false;

        vid.classList.remove(
            'visual-fullscreen'
        );

        document.body.classList.remove(
            'private-visual-fullscreen'
        );

        fullscreenBtn.classList.remove(
            'visual-fullscreen-button'
        );

        fullscreenBtn.innerHTML =
            '⛶ Fullscreen';


        console.log(
            'Exited VISUAL fullscreen'
        );

    }


    function toggleVisualFullscreen() {

        if (visualFullscreen) {

            exitVisualFullscreen();

        } else {

            enterVisualFullscreen();

        }

    }


    // =========================================================
    // FULLSCREEN BUTTON
    // =========================================================

    fullscreenBtn.addEventListener(
        'click',
        toggleVisualFullscreen
    );


    // =========================================================
    // DOUBLE CLICK
    // =========================================================

    vid.addEventListener(
        'dblclick',
        toggleVisualFullscreen
    );


    // =========================================================
    // ESCAPE
    // =========================================================

    document.addEventListener(
        'keydown',
        (event) => {

            if (
                event.key === 'Escape' &&
                visualFullscreen
            ) {

                exitVisualFullscreen();

            }

        }
    );


    // =========================================================
    // PAGE VISIBILITY
    // =========================================================

    document.addEventListener(
        'visibilitychange',
        () => {

            if (
                !document.hidden &&
                !visualFullscreen
            ) {

                setTimeout(() => {

                    twPlayer.play();

                }, 100);

            }

        }
    );


    // =========================================================
    // WINDOW LOAD
    // =========================================================

    window.addEventListener(
        'load',
        () => {

            setTimeout(() => {

                twPlayer.play();

            }, 1000);

        }
    );

</script>
