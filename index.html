    /*

<!-- MAIN THEATER / PRIVATE COMPANION STREAM -->

        ⚠️ STREAM LOCKED<br> Keep the mini Twitch frame running in the top-right to watch!

        aria-label="Toggle fullscreen"

<!-- MASTER WATCH ENGAGEMENT DASHBOARD --> 
<div class="audio-dashboard"> 
    <button 
        id="btn-audio-unlock" 
        class="audio-tab" 
        onclick="unlockAlternativeStream()"
    > 
        📺 Click to Watch Alternative Livestream
    </button> 
</div> 

<script> 

    // ========================================================= 
    // CONFIGURATION 
    // ========================================================= 
    const CHANNEL_NAME = 'fraudvlent'; 
    const STREAM_SOURCE = 'https://rain-fields-primarily-settlement.trycloudflare.com/live/watchparty/whep'; 
    
    // ========================================================= 
    // TWITCH PLAYER 
    // ========================================================= 
    const twOptions = { 
        width: '400', 
        height: '300', 
        channel: CHANNEL_NAME, 
        muted: true, 
        parent: ["blqyed.github.io", window.location.hostname] 
    }; 

    const twPlayer = new Twitch.Player("twitch-frame", twOptions); 

    // ========================================================= 
    // DOM ELEMENTS 
    // ========================================================= 
    const vid = document.getElementById('private-feed'); 
    const gate = document.getElementById('gate'); 
    const audioBtn = document.getElementById('btn-audio-unlock');
    const twitchBox = document.getElementById('twitch-mini-box');
    const fullscreenBtn = document.getElementById('custom-fullscreen-btn');
    
    vid.muted = true; 

    let systemUnlocked = false;
    let keepTwitchAliveInterval = null;
    let visualFullscreen = false;

    // ========================================================= 
    // MEDIAMTX WEBRTC READER 
    // ========================================================= 
    let webrtcReader = new MediaMTXWebRTCReader({ 
        url: STREAM_SOURCE, 

        onError: (err) => { 
            console.error(err); 
        }, 

        onTrack: (evt) => { 
            vid.srcObject = evt.streams[0]; 
        }, 

    }); 
    
    // ========================================================= 
    // MASTER STREAM UNLOCK ENGINE
    // ========================================================= 
    function unlockAlternativeStream() { 
        systemUnlocked = true;
        
        audioBtn.innerHTML = "✨ Viewing Alternative Livestream";
        audioBtn.classList.add('activated');
        audioBtn.onclick = null; 
        
        vid.muted = false; 
        vid.controls = true; 
        
        if (twPlayer) {
            twPlayer.setMuted(false); 
            twPlayer.setVolume(0.01); 
            twPlayer.play();
        }
        
        vid.play().catch(err => 
            console.log(
                "User interaction play bypass applied:", 
                err
            )
        );
    } 
    
    // ========================================================= 
    // FORCE TWITCH PLAYER TO STAY ALIVE
    // ========================================================= 
    function keepTwitchAlive() {

        if (twPlayer && twPlayer.isPaused()) {

            console.log("Twitch was paused, forcing play...");

            twPlayer.play();
            
            if (twPlayer.getMuted()) {

                twPlayer.setMuted(false);
                twPlayer.setVolume(0.01);

            }
        }
    }
    
    // ========================================================= 
    // TWITCH VERIFICATION CONTROL SYSTEM
    // ========================================================= 
    twPlayer.addEventListener(
        Twitch.Player.READY, 
        () => { 

            twPlayer.play();
            
            // Start aggressive keep-alive interval
            keepTwitchAliveInterval = setInterval(
                keepTwitchAlive, 
                500
            );
        
            twPlayer.addEventListener(
                Twitch.Player.PLAY, 
                () => {
                    console.log("Twitch Status: PLAYING");
                }
            );
        
            twPlayer.addEventListener(
                Twitch.Player.PAUSE, 
                () => {

                    console.log(
                        "Twitch Status: PAUSED - Attempting to resume"
                    );

                    setTimeout(() => {
                        twPlayer.play();
                    }, 100);

                }
            );
        
            // Main verification loop
            setInterval(() => { 

                const twitchPaused = twPlayer.isPaused(); 
            
                if (twitchPaused) {

                    console.log(
                        "Verification loop detected pause - forcing play"
                    );

                    twPlayer.play();

                    if (twPlayer.getMuted()) {
                        twPlayer.setMuted(false);
                        twPlayer.setVolume(0.01);
                    }

                }
            
                if (systemUnlocked) {

                    gate.style.display = 'none'; 
                
                    if (vid.paused) { 

                        vid.play().catch(
                            err => console.log(
                                "Background playback loop stabilization:",
                                err
                            )
                        ); 

                    } 

                    vid.muted = false;

                } else {

                    if (twitchPaused && !systemUnlocked) { 

                        gate.style.display = 'flex'; 
                        vid.pause(); 

                    } else { 

                        gate.style.display = 'none'; 
                        vid.muted = true; 

                    } 

                } 

            }, 250); 

        }
    ); 
    
    // ========================================================= 
    // VISUAL FULLSCREEN
    // ========================================================= 

    function enterVisualFullscreen() {

        if (visualFullscreen) {
            return;
        }

        visualFullscreen = true;

        vid.classList.add('visual-fullscreen');
        document.body.classList.add('private-visual-fullscreen');
        fullscreenBtn.classList.add('visual-fullscreen-button');

        fullscreenBtn.innerHTML = '⛶ Exit Fullscreen';

        console.log(
            'Entered VISUAL fullscreen'
        );
    }

    function exitVisualFullscreen() {

        if (!visualFullscreen) {
            return;
        }

        visualFullscreen = false;

        vid.classList.remove('visual-fullscreen');
        document.body.classList.remove('private-visual-fullscreen');
        fullscreenBtn.classList.remove('visual-fullscreen-button');

        fullscreenBtn.innerHTML = '⛶ Fullscreen';

        console.log(
            'Exited VISUAL fullscreen'
        );
    }

    function toggleVisualFullscreen() {

        if (visualFullscreen) {
            exitVisualFullscreen();
        } else {
            enterVisualFullscreen();
        }

    }

    // Custom fullscreen button.
    fullscreenBtn.addEventListener(
        'click',
        toggleVisualFullscreen
    );

    // Double-clicking the private video also toggles visual fullscreen.
    vid.addEventListener(
        'dblclick',
        toggleVisualFullscreen
    );

    // Escape exits visual fullscreen.
    document.addEventListener(
        'keydown',
        (event) => {

            if (
                event.key === 'Escape' &&
                visualFullscreen
            ) {

                exitVisualFullscreen();

            }

        }
    );

    // ========================================================= 
    // ADDITIONAL SAFEGUARDS 
    // ========================================================= 

    document.addEventListener(
        'visibilitychange',
        () => {

            if (!document.hidden) {

                setTimeout(() => {
                    twPlayer.play();
                }, 100);

            }

        }
    );
    
    window.addEventListener(
        'load',
        () => {

            setTimeout(() => {
                twPlayer.play();
            }, 1000);

        }
    );

</script>
