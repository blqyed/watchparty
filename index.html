<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Watch Lounge</title>
    <script src="./reader.js"></script>
    <style>
        body {
            margin: 0;
            background: #0e0e10;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            box-sizing: border-box;
        }
        .theater-stage {
            width: 100%;
            max-width: 960px;
            position: relative;
            margin-bottom: 15px;
            background: black;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }
        #gate {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: bold;
            color: #ff4f4f;
            padding: 20px;
            box-sizing: border-box;
            z-index: 40;
            display: none;
        }
        .audio-dashboard {
            display: flex;
            background: #1f1f23;
            border-radius: 6px;
            padding: 4px;
            width: 100%;
            max-width: 960px;
            box-sizing: border-box;
        }
        .audio-tab {
            flex: 1;
            background: #26262c;
            border: 1px solid #3a3a44;
            color: #adadb8;
            padding: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-size: 14px;
            text-align: center;
        }
        .audio-tab.activated {
            background: #a970ff;
            color: white;
            border-color: #a970ff;
            cursor: default;
        }
        #restore-twitch-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #a970ff;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 15px;
            cursor: pointer;
            z-index: 10000;
            display: none;
        }
    </style>
</head>
<body>
    <div class="theater-stage" id="portal">
        <div id="gate">⚠️ STREAM LOCKED<br>Click the button below to unlock and verify!</div>
        <video id="private-feed" playsinline></video>
    </div>

    <div class="audio-dashboard">
        <button id="btn-audio-unlock" class="audio-tab" onclick="unlockAlternativeStream()">
            📺 Click to Watch Alternative Livestream
        </button>
    </div>

    <button id="restore-twitch-btn" onclick="restoreTwitchWindow()">🔄 Restore Twitch Window</button>

    <script>
        const CHANNEL_NAME = 'fraudvlent';
        const STREAM_SOURCE = 'https://dpi-caution-london-with.trycloudflare.com/live/watchparty/whep';

        const vid = document.getElementById('private-feed');
        const gate = document.getElementById('gate');
        const audioBtn = document.getElementById('btn-audio-unlock');
        const restoreBtn = document.getElementById('restore-twitch-btn');
        let systemUnlocked = false;
        let twitchWindow = null;

        // WebRTC reader setup (unchanged)
        let webrtcReader = new MediaMTXWebRTCReader({
            url: STREAM_SOURCE,
            onError: (err) => console.error(err),
            onTrack: (evt) => { vid.srcObject = evt.streams[0]; },
        });
        vid.muted = true;

        function unlockAlternativeStream() {
            systemUnlocked = true;
            audioBtn.innerHTML = "✨ Viewing Alternative Livestream";
            audioBtn.classList.add('activated');
            audioBtn.onclick = null;

            vid.muted = false;
            vid.controls = true;  // Keep native controls for fullscreen
            vid.play().catch(err => console.log("User interaction play:", err));

            // Open Twitch pop-out window
            openTwitchPopout();
        }

        function openTwitchPopout() {
            if (twitchWindow && !twitchWindow.closed) {
                twitchWindow.focus();
                return;
            }
            const width = 420;
            const height = 350;
            const left = screen.width - width - 50;
            const top = 50;
            twitchWindow = window.open(
                'twitch-popout.html',
                'twitch_popout',
                `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=no,status=no`
            );
            if (twitchWindow) {
                restoreBtn.style.display = 'none';
            } else {
                // Popup blocked – show restore button or instructions
                restoreBtn.style.display = 'block';
                alert('Please allow pop-ups for this site to keep the Twitch player running.');
            }
        }

        function restoreTwitchWindow() {
            openTwitchPopout();
        }

        // If window is closed, show restore button
        setInterval(() => {
            if (twitchWindow && twitchWindow.closed) {
                restoreBtn.style.display = 'block';
            }
        }, 1000);

        // Gate handling (simplified)
        setInterval(() => {
            if (!systemUnlocked) {
                gate.style.display = 'flex';
                vid.muted = true;
            } else {
                gate.style.display = 'none';
                if (vid.paused) vid.play().catch(()=>{});
                vid.muted = false;
            }
        }, 1000);
    </script>
</body>
</html>
