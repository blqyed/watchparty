<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Watch Lounge</title>
    <script src="./reader.js"></script>
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
    <style>
        body { margin: 0; background: #0e0e10; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        .box { width: 100%; max-width: 480px; margin-bottom: 15px; position: relative; }
        h4 { margin: 8px 0; text-align: center; color: #a970ff; font-size: 14px; }
        #portal { position: relative; }
        #gate { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; text-align: center; font-weight: bold; color: #ff4f4f; padding: 20px; box-sizing: border-box; z-index: 100; display: none; }
        video { width: 100%; background: black; }
    </style>
</head>
<body>
    <div class="box">
        <h4>1. ACTIVE TWITCH VERIFICATION FEED</h4>
        <div id="twitch-frame"></div>
    </div>
    <div class="box" id="portal">
        <h4>2. PRIVATE COMPANION STREAM</h4>
        <div id="gate">⚠️ STREAM LOCKED<br>Unpause and unmute the Twitch frame above to watch!</div>
        <video id="private-feed" controls playsinline></video>
    </div>
    <script>
        // CONFIGURATION: Set your Twitch channel and paste your Cloudflare Tunnel URL
        const CHANNEL_NAME = 'fraudvlent';
        const STREAM_SOURCE = 'https://chance-enzyme-stroke-msie.trycloudflare.com/live/watchparty/whep';
        const twOptions = { width: '100%', height: 240, channel: CHANNEL_NAME, parent: [window.location.hostname] };
        const twPlayer = new Twitch.Player("twitch-frame", twOptions);
        const vid = document.getElementById('private-feed');
        const gate = document.getElementById('gate');

        let webrtcReader = new MediaMTXWebRTCReader({
            url: STREAM_SOURCE,
            onError: (err) => { console.error(err); },
            onTrack: (evt) => {
                vid.srcObject = evt.streams[0];
            },
        });

        // Wait for the Twitch embed to actually finish loading before polling
        // it — calling isPaused()/getMuted() too early can throw errors.
        twPlayer.addEventListener(Twitch.Player.READY, () => {
            setInterval(() => {
                if (twPlayer.isPaused() || twPlayer.getMuted() || twPlayer.getVolume() === 0) {
                    gate.style.display = 'flex';
                    vid.pause();
                } else {
                    gate.style.display = 'none';
                }
            }, 1000);
        });
    </script>
</body>
</html>
