<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Live Watch Lounge</title> 
    <script src="./reader.js"></script> 
    <script src="https://player.twitch.tv/js/embed/v1.js"></script> 
    <style> 
        body { 
            margin: 0; 
            background: #0e0e10; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
            box-sizing: border-box; 
        } 
        /* MAIN THEATER CONTAINER */ 
        .theater-stage { 
            width: 100%; 
            max-width: 960px; 
            position: relative; 
            margin-bottom: 15px; 
            background: black; 
            aspect-ratio: 16 / 9; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); 
        } 
        /* MAIN PRIVATE COMPANION STREAM */ 
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            background: black; 
        } 
        /* FLOATING TWITCH VERIFICATION PLAYER */ 
        .twitch-mini-box { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            width: 400px; 
            height: 300px; 
            z-index: 50; 
            background: #000; 
            border: 2px solid #a970ff; 
            border-radius: 4px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.75); 
        } 
        #twitch-frame { 
            width: 100%; 
            height: 100%; 
            transition: filter 0.2s ease;
        } 
        /* LOCK GATE */ 
        #gate { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.95); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            font-weight: bold; 
            color: #ff4f4f; 
            padding: 20px; 
            box-sizing: border-box; 
            z-index: 40; 
            display: none; 
        } 
        /* INTERNAL AUDIO TOGGLE HUD */ 
        .audio-dashboard { 
            display: flex; 
            background: #1f1f23; 
            border-radius: 6px; 
            padding: 4px; 
            width: 100%; 
            max-width: 960px; 
            box-sizing: border-box; 
            gap: 4px; 
        } 
        .audio-tab { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: #adadb8; 
            padding: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 4px; 
            transition: all 0.2s ease; 
            font-size: 14px; 
            text-align: center; 
        } 
        .audio-tab.active { 
            background: #a970ff; 
            color: white; 
        } 
        .audio-tab:hover:not(.active) { 
            background: #26262c; 
            color: white; 
        } 
        @media (max-width: 700px) { 
            .theater-stage { 
                overflow: auto; 
            } 
            .twitch-mini-box { 
                position: absolute; 
                top: 15px; 
                right: 15px; 
                width: 400px; 
                height: 300px; 
            } 
        } 
    </style> 
</head> 
<body> 
    <!-- MAIN THEATER / PRIVATE COMPANION STREAM --> 
    <div class="theater-stage" id="portal"> 
        <!-- VERIFICATION GATE --> 
        <div id="gate"> 
            ⚠️ STREAM LOCKED<br> Unpause and unmute the mini Twitch frame in the top-right to watch! 
        </div> 
        <!-- FLOATING TWITCH VERIFICATION PLAYER --> 
        <div class="twitch-mini-box"> 
            <div id="twitch-frame"></div> 
        </div> 
        <!-- PRIVATE COMPANION STREAM --> 
        <video id="private-feed" controls playsinline></video> 
    </div> 
    <!-- INTERNAL AUDIO TOGGLE HUD --> 
    <div class="audio-dashboard"> 
        <button id="btn-twitch" class="audio-tab active" onclick="routeAudio('twitch')"> 
            🔊 Listen to Twitch Feed 
        </button> 
        <button id="btn-companion" class="audio-tab" onclick="routeAudio('companion')"> 
            🔊 Listen to Companion Feed 
        </button> 
    </div> 
    <script> 
        // ========================================================= 
        // CONFIGURATION 
        // ========================================================= 
        const CHANNEL_NAME = 'fraudvlent'; 
        const STREAM_SOURCE = 'https://trycloudflare.com'; 
        
        // ========================================================= 
        // TWITCH PLAYER 
        // ========================================================= 
        const twOptions = { 
            width: '100%', 
            height: '100%', 
            channel: CHANNEL_NAME, 
            parent: [window.location.hostname] 
        }; 
        const twPlayer = new Twitch.Player("twitch-frame", twOptions); 
        
        // ========================================================= 
        // DOM ELEMENTS 
        // ========================================================= 
        const vid = document.getElementById('private-feed'); 
        const gate = document.getElementById('gate'); 
        
        // ========================================================= 
        // AUDIO ROUTING STATE 
        // ========================================================= 
        let chosenAudioTarget = 'twitch'; 
        let savedTwitchVolume = 1.0; 
        let internalVolumeChange = false; 
        
        // ========================================================= 
        // MEDIAMTX WEBRTC READER 
        // ========================================================= 
        let webrtcReader = new MediaMTXWebRTCReader({ 
            url: STREAM_SOURCE, 
            onError: (err) => { 
                console.error(err); 
            }, 
            onTrack: (evt) => { 
                vid.srcObject = evt.streams[0]; // FIXED: Array mapping restored
            }, 
        }); 
        
        // ========================================================= 
        // AUDIO ROUTING 
        // ========================================================= 
        function routeAudio(selection) { 
            chosenAudioTarget = selection; 
            document.getElementById('btn-twitch').classList.toggle('active', selection === 'twitch'); 
            document.getElementById('btn-companion').classList.toggle('active', selection === 'companion'); 
            
            const twitchFrameEl = document.getElementById('twitch-frame');

            if (selection === 'twitch') { 
                // Restore audible output to Twitch element via CSS
                if (twitchFrameEl) twitchFrameEl.style.filter = 'none';

                internalVolumeChange = true; 
                twPlayer.setVolume(savedTwitchVolume > 0.1 ? savedTwitchVolume : 1.0); 
                internalVolumeChange = false; 
                
                vid.muted = true; 
            } else { 
                // Hide audio component from browser via inline SVG canvas linear transfer filter
                if (twitchFrameEl) twitchFrameEl.style.filter = 'url("data:image/svg+xml;utf8,<svg xmlns=\'http://w3.org\'><filter id=\'mute\'><feComponentTransfer><feFuncA type=\'linear\' slope=\'0\'/></feComponentTransfer></filter></svg>#mute")';

                internalVolumeChange = true; 
                twPlayer.setVolume(savedTwitchVolume > 0.1 ? savedTwitchVolume : 1.0); 
                internalVolumeChange = false; 
                
                vid.muted = false; 
            } 
        } 
        
        // ========================================================= 
        // TWITCH READY / VERIFICATION LOOP 
        // ========================================================= 
        twPlayer.addEventListener(Twitch.Player.READY, () => { 
            savedTwitchVolume = twPlayer.getVolume(); 
            if (!savedTwitchVolume || savedTwitchVolume <= 0.1) { 
                savedTwitchVolume = 1.0; 
            } 
            routeAudio('twitch'); 
            
            setInterval(() => { 
                const twitchMuted = twPlayer.getMuted(); 
                const twitchPaused = twPlayer.isPaused(); 
                const twitchVolume = twPlayer.getVolume(); 
                
                if (chosenAudioTarget === 'twitch' && !internalVolumeChange && twitchVolume > 0.1) { 
                    savedTwitchVolume = twitchVolume; 
                } 
                
                const invalidTwitchState = twitchPaused || twitchMuted || (chosenAudioTarget === 'twitch' && twitchVolume === 0); 
                
                if (invalidTwitchState) { 
                    gate.style.display = 'flex'; 
                    vid.pause(); 
                } else { 
                    gate.style.display = 'none'; 
                    if (vid.paused) { 
                        vid.play().catch(err => console.log("Autoplay content frame check:", err)); 
                    } 
                } 
            }, 1000); 
        }); 
    </script> 
</body> 
</html>
