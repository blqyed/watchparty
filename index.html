<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Live Watch Lounge</title> 
    <script src="./reader.js"></script> 
    <script src="https://twitch.tv"></script> 
    <style> 
        body { 
            margin: 0; 
            background: #0e0e10; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
            box-sizing: border-box; 
        } 
        /* MAIN THEATER CONTAINER */ 
        .theater-stage { 
            width: 100%; 
            max-width: 960px; 
            position: relative; 
            margin-bottom: 15px; 
            background: black; 
            aspect-ratio: 16 / 9; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); 
        } 
        /* MAIN PRIVATE COMPANION STREAM */ 
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            background: black; 
        } 
        
        /* FLOATING TWITCH VERIFICATION PLAYER */ 
        .twitch-mini-box { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            width: 400px; 
            height: 300px; 
            z-index: 50; 
            background: #000; 
            border: 2px solid #a970ff; 
            border-radius: 4px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.75); 
        } 
        #twitch-frame { 
            width: 100%; 
            height: 100%; 
        } 
        /* LOCK GATE */ 
        #gate { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.95); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            font-weight: bold; 
            color: #ff4f4f; 
            padding: 20px; 
            box-sizing: border-box; 
            z-index: 40; 
            display: none; 
        } 
        /* STREAMLINED AUDIO UNLOCK ACTION HUB */ 
        .audio-dashboard { 
            display: flex; 
            background: #1f1f23; 
            border-radius: 6px; 
            padding: 4px; 
            width: 100%; 
            max-width: 960px; 
            box-sizing: border-box; 
        } 
        .audio-tab { 
            flex: 1; 
            background: #26262c; 
            border: 1px solid #3a3a44; 
            color: #adadb8; 
            padding: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 4px; 
            transition: all 0.2s ease; 
            font-size: 14px; 
            text-align: center; 
        } 
        .audio-tab:hover { 
            background: #33333b; 
            color: white; 
            border-color: #a970ff;
        }
        .audio-tab.activated { 
            background: #a970ff; 
            color: white; 
            border-color: #a970ff;
            cursor: default;
        } 
        @media (max-width: 700px) { 
            .theater-stage { 
                overflow: auto; 
            } 
            .twitch-mini-box { 
                position: absolute; 
                top: 15px; 
                right: 15px; 
                width: 400px; 
                height: 300px; 
            } 
        } 
    </style> 
</head> 
<body> 
    <!-- MAIN THEATER / PRIVATE COMPANION STREAM --> 
    <div class="theater-stage" id="portal"> 
        <!-- VERIFICATION GATE --> 
        <div id="gate"> 
            ⚠️ STREAM LOCKED<br> Keep the mini Twitch frame running in the top-right to watch! 
        </div> 
        <!-- FLOATING TWITCH VERIFICATION PLAYER --> 
        <div class="twitch-mini-box"> 
            <div id="twitch-frame"></div> 
        </div> 
        <!-- PRIVATE COMPANION STREAM --> 
        <video id="private-feed" controls playsinline></video> 
    </div> 
    
    <!-- MASTER WATCH ENGAGEMENT DASHBOARD --> 
    <div class="audio-dashboard"> 
        <button id="btn-audio-unlock" class="audio-tab" onclick="unlockAlternativeStream()"> 
            📺 Click to Watch Alternative Livestream
        </button> 
    </div> 
    
    <script> 
        // ========================================================= 
        // CONFIGURATION 
        // ========================================================= 
        const CHANNEL_NAME = 'fraudvlent'; 
        const STREAM_SOURCE = 'https://trycloudflare.com'; 
        
        // ========================================================= 
        // TWITCH PLAYER (Fixed for GitHub Pages domain)
        // ========================================================= 
        const twOptions = { 
            width: '100%', 
            height: '100%', 
            channel: CHANNEL_NAME, 
            muted: true, 
            parent: ["blqyed.github.io", window.location.hostname] // 👈 ADD YOUR GITHUB PAGES DOMAIN HERE
        }; 
        const twPlayer = new Twitch.Player("twitch-frame", twOptions); 
 
        // ========================================================= 
        // DOM ELEMENTS 
        // ========================================================= 
        const vid = document.getElementById('private-feed'); 
        const gate = document.getElementById('gate'); 
        const audioBtn = document.getElementById('btn-audio-unlock');
        
        // Safe default background boot states
        vid.muted = true; 
        let systemUnlocked = false;
        
        // ========================================================= 
        // MEDIAMTX WEBRTC READER 
        // ========================================================= 
        let webrtcReader = new MediaMTXWebRTCReader({ 
            url: STREAM_SOURCE, 
            onError: (err) => { 
                console.error(err); 
            }, 
            onTrack: (evt) => { 
                vid.srcObject = evt.streams[0]; 
            }, 
        }); 
        
        // ========================================================= 
        // MASTER STREAM UNLOCK ENGINE (TRIGGERS ALL ACTIONS AT ONCE)
        // ========================================================= 
        function unlockAlternativeStream() { 
            systemUnlocked = true;
            
            // 1. Shift button presentation layout state
            audioBtn.innerHTML = "✨ Viewing Alternative Livestream";
            audioBtn.classList.add('activated');
            audioBtn.onclick = null; 
            
            // 2. Clear out any browser muted states instantly
            vid.muted = false; 
            
            // 3. Force active canvas hardware filter over Twitch to lock its volume out of the box output
            const twitchFrameEl = document.getElementById('twitch-frame');
            if (twitchFrameEl) {
                twitchFrameEl.style.filter = 'url("data:image/svg+xml;utf8,<svg xmlns=\'http://w3.org\'><filter id=\'mute\'><feComponentTransfer><feFuncA type=\'linear\' slope=\'0\'/></feComponentTransfer></filter></svg>#mute")';
            }
            
            // 4. Force immediate video player container engine ignition
            vid.play().catch(err => console.log("User interaction play bypass applied:", err));
        } 
        
        // ========================================================= 
        // TWITCH VERIFICATION CONTROL SYSTEM
        // ========================================================= 
        twPlayer.addEventListener(Twitch.Player.READY, () => { 
            // Ignite Twitch video instantly in the background without throwing browser prompts
            twPlayer.play();

            setInterval(() => { 
                const twitchPaused = twPlayer.isPaused(); 
                
                // If a user manually pauses Twitch, lock down the gate wrapper immediately
                if (twitchPaused) { 
                    gate.style.display = 'flex'; 
                    vid.pause(); 
                } else { 
                    gate.style.display = 'none'; 
                    
                    // Force system alignment if unlocked 
                    if (systemUnlocked) {
                        if (vid.paused) { 
                            vid.play().catch(err => console.log("Background playback loop stabilization:", err)); 
                        } 
                        vid.muted = false;
                    } else {
                        vid.muted = true;
                    }
                } 
            }, 1000); 
        }); 
    </script> 
</body> 
</html>
