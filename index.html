<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Live Watch Lounge</title> 
    <script src="./reader.js"></script> 
    <script src="https://player.twitch.tv/js/embed/v1.js"></script> 
    <style> 
        body { 
            margin: 0; 
            background: #0e0e10; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
            box-sizing: border-box; 
            position: relative; 
        } 
        
        /* MAIN LAYOUT CONTAINER */
        .main-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            justify-content: center;
            align-items: flex-start;
        }
        
        /* MAIN THEATER CONTAINER */
        .theater-stage { 
            flex: 1;
            max-width: 960px;
            position: relative; 
            background: black; 
            aspect-ratio: 16 / 9; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); 
        } 
        
        /* MAIN PRIVATE COMPANION STREAM */ 
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            background: black; 
        } 
        
        /* FLOATING TWITCH VERIFICATION PLAYER - Now in sidebar */
        .twitch-sidebar {
            width: 400px;
            min-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .twitch-mini-box { 
            width: 400px !important; 
            height: 300px !important; 
            min-width: 400px;
            min-height: 300px;
            background: #000; 
            border: 2px solid #a970ff; 
            border-radius: 4px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.75); 
            pointer-events: none; 
            position: relative;
        } 
        
        #twitch-frame { 
            width: 100%; 
            height: 100%; 
            pointer-events: none;
        } 
        
        /* Overlay to prevent interaction */
        .twitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            background: transparent;
        }
        
        /* LOCK GATE */ 
        #gate { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.95); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            font-weight: bold; 
            color: #ff4f4f; 
            padding: 20px; 
            box-sizing: border-box; 
            z-index: 40; 
            display: none; 
        } 
        
        /* STREAMLINED AUDIO UNLOCK ACTION HUB */ 
        .audio-dashboard { 
            display: flex; 
            background: #1f1f23; 
            border-radius: 6px; 
            padding: 4px; 
            width: 100%; 
            max-width: 960px; 
            box-sizing: border-box; 
            margin-top: 15px;
        } 
        
        .audio-tab { 
            flex: 1; 
            background: #26262c; 
            border: 1px solid #3a3a44; 
            color: #adadb8; 
            padding: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 4px; 
            transition: all 0.2s ease; 
            font-size: 14px; 
            text-align: center; 
        } 
        
        .audio-tab:hover { 
            background: #33333b; 
            color: white; 
            border-color: #a970ff;
        }
        
        .audio-tab.activated { 
            background: #a970ff; 
            color: white; 
            border-color: #a970ff;
            cursor: default;
        } 
        
        /* Responsive design for smaller screens */
        @media (max-width: 1400px) { 
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            
            .twitch-sidebar {
                width: 100%;
                max-width: 960px;
                min-width: auto;
                flex-direction: row;
                justify-content: center;
            }
            
            .twitch-mini-box {
                width: 400px !important;
                height: 300px !important;
            }
        }
        
        @media (max-width: 700px) { 
            .twitch-mini-box { 
                display: none; 
            } 
        } 
    </style> 
</head> 
<body> 
    <!-- MAIN LAYOUT -->
    <div class="main-container">
        <!-- MAIN THEATER / PRIVATE COMPANION STREAM --> 
        <div class="theater-stage" id="portal"> 
            <!-- VERIFICATION GATE --> 
            <div id="gate"> 
                ⚠️ STREAM LOCKED<br> Keep the mini Twitch frame running to watch! 
            </div> 
            <!-- PRIVATE COMPANION STREAM --> 
            <video id="private-feed" playsinline></video> 
        </div>
        
        <!-- TWITCH SIDEBAR -->
        <div class="twitch-sidebar">
            <div class="twitch-mini-box"> 
                <div id="twitch-frame"></div>
                <div class="twitch-overlay"></div>
            </div>
            <!-- Optional: Add some info or stats here -->
            <div style="color: #a970ff; font-size: 12px; text-align: center; padding: 10px;">
                🔒 Twitch Verification Active
            </div>
        </div>
    </div>
    
    <!-- MASTER WATCH ENGAGEMENT DASHBOARD --> 
    <div class="audio-dashboard"> 
        <button id="btn-audio-unlock" class="audio-tab" onclick="unlockAlternativeStream()"> 
            📺 Click to Watch Alternative Livestream
        </button> 
    </div> 
    
    <script> 
        // ========================================================= 
        // CONFIGURATION 
        // ========================================================= 
        const CHANNEL_NAME = 'fraudvlent'; 
        const STREAM_SOURCE = 'https://chance-enzyme-stroke-msie.trycloudflare.com/live/watchparty/whep'; 
        
        // ========================================================= 
        // TWITCH PLAYER 
        // ========================================================= 
        const twOptions = { 
            width: '400', 
            height: '300', 
            channel: CHANNEL_NAME, 
            muted: true, 
            parent: ["blqyed.github.io", window.location.hostname] 
        }; 
        const twPlayer = new Twitch.Player("twitch-frame", twOptions); 
 
        // ========================================================= 
        // DOM ELEMENTS 
        // ========================================================= 
        const vid = document.getElementById('private-feed'); 
        const gate = document.getElementById('gate'); 
        const audioBtn = document.getElementById('btn-audio-unlock');
        
        vid.muted = true; 
        let systemUnlocked = false;
        let twitchKeepAliveInterval = null;
        
        // ========================================================= 
        // MEDIAMTX WEBRTC READER 
        // ========================================================= 
        let webrtcReader = new MediaMTXWebRTCReader({ 
            url: STREAM_SOURCE, 
            onError: (err) => { 
                console.error(err); 
            }, 
            onTrack: (evt) => { 
                vid.srcObject = evt.streams[0]; 
            }, 
        }); 
        
        // ========================================================= 
        // MASTER STREAM UNLOCK ENGINE
        // ========================================================= 
        function unlockAlternativeStream() { 
            systemUnlocked = true;
            
            audioBtn.innerHTML = "✨ Viewing Alternative Livestream";
            audioBtn.classList.add('activated');
            audioBtn.onclick = null; 
            
            vid.muted = false; 
            vid.controls = true; 
            
            if (twPlayer) {
                twPlayer.setMuted(false); 
                twPlayer.setVolume(0.01); 
                twPlayer.play();
            }
            
            vid.play().catch(err => console.log("User interaction play bypass applied:", err));
        } 
        
        // ========================================================= 
        // TWITCH KEEP-ALIVE SYSTEM
        // ========================================================= 
        function keepTwitchAlive() {
            if (twPlayer && twPlayer.isPaused()) {
                console.log("Twitch paused - forcing play");
                twPlayer.play();
                
                // Ensure volume is set for view counting
                if (twPlayer.getMuted()) {
                    twPlayer.setMuted(false);
                    twPlayer.setVolume(0.01);
                }
            }
        }
        
        // ========================================================= 
        // TWITCH VERIFICATION CONTROL SYSTEM
        // ========================================================= 
        twPlayer.addEventListener(Twitch.Player.READY, () => { 
            twPlayer.play();
            
            // Start keep-alive with faster interval
            twitchKeepAliveInterval = setInterval(keepTwitchAlive, 500);

            twPlayer.addEventListener(Twitch.Player.PLAY, () => {
                console.log("Twitch Status: PLAYING");
            });

            twPlayer.addEventListener(Twitch.Player.PAUSE, () => {
                console.log("Twitch Status: PAUSED - Resuming");
                // Immediate resume
                setTimeout(() => {
                    twPlayer.play();
                    if (twPlayer.getMuted()) {
                        twPlayer.setMuted(false);
                        twPlayer.setVolume(0.01);
                    }
                }, 100);
            });

            // Main verification loop
            setInterval(() => { 
                const twitchPaused = twPlayer.isPaused(); 
                
                // Always try to keep Twitch playing
                if (twitchPaused) {
                    keepTwitchAlive();
                }
                
                if (systemUnlocked) {
                    // Once unlocked, don't let Twitch affect alt stream
                    gate.style.display = 'none'; 
                    
                    if (vid.paused) { 
                        vid.play().catch(err => console.log("Background playback loop stabilization:", err)); 
                    } 
                    vid.muted = false;
                } else {
                    // Only enforce verification BEFORE unlock
                    if (twitchPaused) { 
                        gate.style.display = 'flex'; 
                        vid.pause(); 
                    } else { 
                        gate.style.display = 'none'; 
                        vid.muted = true; 
                    }
                }
            }, 250); // Faster check interval
        }); 
        
        // ========================================================= 
        // ADDITIONAL SAFEGUARDS
        // ========================================================= 
        // Keep Twitch playing when tab becomes visible again
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && twPlayer) {
                setTimeout(() => {
                    twPlayer.play();
                    if (twPlayer.getMuted()) {
                        twPlayer.setMuted(false);
                        twPlayer.setVolume(0.01);
                    }
                }, 100);
            }
        });
        
        // Handle page unload to clean up
        window.addEventListener('beforeunload', () => {
            if (twitchKeepAliveInterval) {
                clearInterval(twitchKeepAliveInterval);
            }
        });
    </script> 
</body> 
</html>
